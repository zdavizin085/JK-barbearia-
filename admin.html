<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JK Barbearia | Painel</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">JK<span> BARBEARIA</span></a><nav><a href="/">Voltar ao site</a></nav></header><main class="section"><div class="eyebrow">ÁREA ADMINISTRATIVA</div><h2>Agendamentos</h2><form id="login"><label>Senha administrativa<input id="token" type="password" required autocomplete="off"></label><button class="btn">ACESSAR</button></form><p id="status" role="status"></p><div id="bookings"></div></main><script>const form=document.getElementById('login'),out=document.getElementById('bookings'),status=document.getElementById('status');let token='';form.onsubmit=async e=>{e.preventDefault();token=document.getElementById('token').value;await load()};async function load(){try{const r=await fetch('/api/admin/bookings',{headers:{'x-admin-token':token}});const data=await r.json();if(!r.ok)throw Error(data.error);form.style.display='none';out.replaceChildren();for(const b of data){const card=document.createElement('article');card.style.cssText='background:#1a1a1a;border:1px solid #403727;border-radius:8px;padding:18px;margin:12px 0';const info=document.createElement('p');info.textContent=`${b.day} às ${b.time} • ${b.name} • ${b.service} • ${b.phone} • ${b.status} • WhatsApp: ${b.notification_status}`;card.append(info);if(b.status==='confirmed'){const button=document.createElement('button');button.className='btn';button.textContent='Cancelar horário';button.onclick=async()=>{if(!confirm('Cancelar este agendamento? O cliente NÃO receberá aviso automático.'))return;const x=await fetch('/api/admin/bookings/'+encodeURIComponent(b.id)+'/cancel',{method:'PATCH',headers:{'x-admin-token':token}});if(x.ok)load();else status.textContent='Falha ao cancelar'};card.append(button)}out.append(card)}status.textContent=data.length+' agendamento(s)';}catch(e){status.textContent=e.message}}</script></body></html>
